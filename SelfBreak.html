
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <!-- Privacy-friendly analytics by Plausible -->
    <script async src="https://plausible.io/js/pa-BePX5Db1IkvdLNb1gswBS.js"></script>
    <script>
      window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},
      plausible.init=plausible.init||function(i){plausible.o=i||{}};
      plausible.init();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>欺骗剑纯模拟器 v1.1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <!-- 新增：职业选择 -->
        <div class="job-select"> 
             <button class="job-btn" onclick="location.href='index.html'">
                ← 模式选择
            </button>
            <button class="job-btn" data-job="Blade">剑纯</button>
            <button class="job-btn" data-job="Flower">万花</button>
            <button class="job-btn" data-job="Toxic">五毒</button>
        </div>

        <canvas id="gameCanvas"></canvas>
        <button id="leaderboardBtn">排行榜(捣鼓中)</button>

        <div id="leaderboardOverlay" class="overlay hidden" aria-hidden="true">
            <div class="modal" role="dialog" aria-modal="true">
                <h3>排行榜</h3>
                <div id="leaderboardContent">
                    <div class="leaderboard-list" id="leaderboardList">
                        <!-- 列表由 JS 渲染 -->
                    </div>
                </div>

                <div style="margin-top:10px;color:#bbb;font-size:13px;">
                    你的成绩：<span id="currentTimeLabel">--</span>
                </div>

                <div class="leaderboard-controls">
                    <input id="playerNameInput" placeholder="输入你的名字（最多 20 字）" maxlength="20" />
                    <button id="saveScoreBtn" style="background:#00b45a;color:#fff">保存</button>
                    <button id="closeLeaderboardBtn" style="background:#555;color:#fff">关闭</button>
                    <button id="clearLeaderboardBtn" style="background:#a33;color:#fff">清空</button>
                </div>
            </div>
        </div>
        <div class="info">
            点击屏幕开始 | By 纵月-李凌安 <br> 希望大家玩的开心~  <br> BUG反馈 QQ:670191833
        </div>
    </div>

    <button id="donateBtn" style="position:fixed;right:14px;bottom:14px;z-index:50;background:rgba(0,0,0,0.72);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:10px 14px;cursor:pointer;">赞赏</button>
    <div id="donateOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.62);display:none;align-items:center;justify-content:center;z-index:60;">
      <div style="background:#1f1f1f;border-radius:12px;padding:16px;width:min(760px,92vw);color:#eee;">
        <div style="font-size:18px;margin-bottom:12px;">若有好心侠士颇具财力，愿意打赏，感谢您的支持。祝侠士天天有奇遇！</div>
        <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;">
          <div style="text-align:center;">
            <div style="margin-bottom:8px;color:#ccc;">支付宝</div>
            <img src="img/Alipay_QR.jpg" alt="Alipay QR" style="width:min(320px,42vw);max-width:320px;border-radius:8px;" />
          </div>
          <div style="text-align:center;">
            <div style="margin-bottom:8px;color:#ccc;">微信</div>
            <img src="img/Wechat_QR.png" alt="Wechat QR" style="width:min(320px,42vw);max-width:320px;border-radius:8px;" />
          </div>
        </div>
        <div style="display:flex;justify-content:flex-end;margin-top:14px;">
          <button id="closeDonateBtn" style="background:#555;color:#fff;border:none;border-radius:6px;padding:6px 12px;cursor:pointer;">关闭</button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        const donateBtn = document.getElementById('donateBtn');
        const overlay = document.getElementById('donateOverlay');
        const closeBtn = document.getElementById('closeDonateBtn');
        if (!donateBtn || !overlay || !closeBtn) return;
        donateBtn.addEventListener('click', () => { overlay.style.display = 'flex'; });
        closeBtn.addEventListener('click', () => { overlay.style.display = 'none'; });
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) overlay.style.display = 'none';
        });
      })();
    </script>
<script type="module" src="./game_selfbreak.js"></script>
<!-- <script type="module" src="./game_selfbreak.js"></script> -->
</body>
</html>
