<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2P Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
                <!-- 新增：职业选择 -->
        <div class="job-select"> 
             <button class="job-btn" onclick="location.href='index.html'">
                ← 模式选择
            </button>
            <button class="job-btn" data-job="Blade">剑纯</button>
            <button class="job-btn" data-job="Flower">万花</button>
            <button class="job-btn" data-job="Toxic">五毒</button>
            <label class="job-btn" style="display:flex;align-items:center;gap:6px;">
                <input id="aComToggle" type="checkbox" />
                A COM
            </label>
            <label class="job-btn" style="display:flex;align-items:center;gap:6px;">
                <input id="bComToggle" type="checkbox" />
                B COM
            </label>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="info">
            A: a准备 s读条 d取消 | B: j准备 k打断 | 鼠标点击= A读条
        </div>
    </div>

    <script type="module" src="./game_2players.js"></script>
</body>
</html>
