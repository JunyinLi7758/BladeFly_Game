<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2P Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
                <!-- 新增：职业选择 -->
        <!-- <div class="job-select">  -->
             <!-- <button class="job-btn" onclick="location.href='index.html'">
                ← 模式选择
            </button> -->
            <!-- <label class="job-btn" style="display:flex;align-items:center;gap:6px;">
                房间:
                <input id="roomIdInput" type="text" value="default" style="width:100px;margin-left:6px;" />
                <button id="btnJoinRoom" class="job-btn" style="margin-left:6px;">加入</button>
            </label> -->
            <!-- <button class="job-btn" data-job="Blade">剑纯</button>
            <button class="job-btn" data-job="Flower">万花</button>
            <button class="job-btn" data-job="Toxic">五毒</button> -->
            <!-- COM toggles removed (use keyboard 1/2 to toggle if needed) -->
        <!-- </div> -->
        <div id="preJoinRules" class="room-panel">
            <div class="room-title">加入房间</div>
            <div class="room-row">
                <input id="roomIdInput" type="text" value="default" placeholder="请输入房间名" />
                <button id="btnJoinRoom" class="job-btn">加入</button>
            </div>
        </div>

        <div id="inRoomBanner" class="room-panel room-panel-live" style="display:none;">
            <div class="room-header">
                <div class="room-title">已进入房间</div>
                <button id="btnMinRoomPanel" class="job-btn room-min-btn" title="最小化">-</button>
            </div>
            <div class="room-text"><span id="roomLabel">房间：</span> <span id="roomIdLabel">-</span></div>
            <div class="room-text"><span id="roleLabel">角色：</span> <span id="roleValue">-</span></div>
            <div class="room-actions">
                <button id="btnSwapRole" class="job-btn room-swap-btn">确认换角</button>
                <button id="btnLeaveRoom" class="job-btn room-exit-btn">退出房间</button>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <!-- External control buttons removed; use screen/touch/keyboard instead -->

        <div class="info">      
            <div id ="ad"> 作者：天鹅坪-李凌安   QQ：670191833</div>
            <div>有BUG/建议欢迎反馈！ 希望大家玩得开心~ 新年快乐！</div>
            <!-- <div id="status">状态: 未连接</div>
            <div id="playerInfo">玩家信息</div>
            <div id="gameInfo">游戏信息</div> -->
        </div>
    </div>

    <button id="donateBtn" style="position:fixed;right:14px;bottom:14px;z-index:50;background:rgba(0,0,0,0.72);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:10px 14px;cursor:pointer;">赞赏</button>
    <div id="donateOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.62);display:none;align-items:center;justify-content:center;z-index:60;">
      <div style="background:#1f1f1f;border-radius:12px;padding:16px;width:min(760px,92vw);color:#eee;">
        <div style="font-size:18px;margin-bottom:12px;">若有好心侠士颇具财力，愿意打赏，感谢您的支持。祝侠士天天有奇遇！</div>
        <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;">
          <div style="text-align:center;">
            <div style="margin-bottom:8px;color:#ccc;">支付宝</div>
            <img src="img/Alipay_QR.jpg" alt="Alipay QR" style="width:min(320px,42vw);max-width:320px;border-radius:8px;" />
          </div>
          <div style="text-align:center;">
            <div style="margin-bottom:8px;color:#ccc;">微信</div>
            <img src="img/Wechat_QR.png" alt="Wechat QR" style="width:min(320px,42vw);max-width:320px;border-radius:8px;" />
          </div>
        </div>
        <div style="display:flex;justify-content:flex-end;margin-top:14px;">
          <button id="closeDonateBtn" style="background:#555;color:#fff;border:none;border-radius:6px;padding:6px 12px;cursor:pointer;">关闭</button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        const donateBtn = document.getElementById('donateBtn');
        const overlay = document.getElementById('donateOverlay');
        const closeBtn = document.getElementById('closeDonateBtn');
        if (!donateBtn || !overlay || !closeBtn) return;
        donateBtn.addEventListener('click', () => { overlay.style.display = 'flex'; });
        closeBtn.addEventListener('click', () => { overlay.style.display = 'none'; });
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) overlay.style.display = 'none';
        });
      })();
    </script>
    <script type="module" src="./game_2players.js"></script>
</body>
</html>
