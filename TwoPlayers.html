<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2P Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
                <!-- 新增：职业选择 -->
        <div class="job-select"> 
             <button class="job-btn" onclick="location.href='index.html'">
                ← 模式选择
            </button>
            <label class="job-btn" style="display:flex;align-items:center;gap:6px;">
                房间:
                <input id="roomIdInput" type="text" value="default" style="width:100px;margin-left:6px;" />
                <button id="btnJoinRoom" class="job-btn" style="margin-left:6px;">加入</button>
            </label>
            <button class="job-btn" data-job="Blade">剑纯</button>
            <button class="job-btn" data-job="Flower">万花</button>
            <button class="job-btn" data-job="Toxic">五毒</button>
            <!-- COM toggles removed (use keyboard 1/2 to toggle if needed) -->
        </div>

        <canvas id="gameCanvas"></canvas>

        <!-- External control buttons removed; use screen/touch/keyboard instead -->

        <div class="info">
            <!-- <div id="status">状态: 未连接</div>
            <div id="playerInfo">玩家信息</div>
            <div id="gameInfo">游戏信息</div> -->
        </div>
    </div>

    <script type="module" src="./game_2players.js"></script>
</body>
</html>
